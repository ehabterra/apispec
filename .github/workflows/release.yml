name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  release:
    runs-on: ubuntu-latest
    # Hoisted to the JOB so the tap step can test it in an `if:`. The `secrets`
    # context is not available in a step-level `if` — written that way the step is
    # skipped even when the secret IS set, which fails silently and looks like the
    # tap simply never updates.
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    permissions:
      contents: write  # Required to create releases and upload assets
      pull-requests: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full history for proper versioning

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Run pre-release validation
        run: |
          # Run linting
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.4
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m
          
          # Run go vet
          go vet ./...
          
          # Check formatting
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi
          
          # Run tests
          go test -v ./...

      - name: Extract version from tag
        id: version
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
          
          # Get git info
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GO_VERSION=$(go version | awk '{print $3}')
          
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "go_version=$GO_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in Makefile
        # VERSION comes from the pushed tag, so it is untrusted input. It is passed
        # through env rather than interpolated into the script with ${{ }}, or a tag
        # named `v1.0.0"; rm -rf /; #` would execute on the runner.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `|` as the sed delimiter, not `/`: a git tag may legally contain a
          # slash, which would otherwise end the substitution early.
          sed -i "s|^VERSION = .*|VERSION = $VERSION|" Makefile
          
          # Update VERSION in scripts/release.sh if it exists
          if [ -f "scripts/release.sh" ]; then
            # ^VERSION= anchored: "VERSION=" is a substring of "GO_VERSION=", and an
            # unanchored /g rewrote scripts/release.sh line 12 too — which is why
            # v0.5.6 ships reporting `Go version: 0.5.6`.
            sed -i "s|^VERSION=\"[^\"]*\"|VERSION=\"$VERSION\"|" scripts/release.sh
          fi

      - name: Update version constants in main.go
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          GO_VERSION: ${{ steps.version.outputs.go_version }}
        run: |
          # Update version constants in cmd/apispec/main.go
          sed -i "s|Version   = \"[^\"]*\"|Version   = \"$VERSION\"|" cmd/apispec/main.go
          sed -i "s|Commit    = \"[^\"]*\"|Commit    = \"$COMMIT\"|" cmd/apispec/main.go
          sed -i "s|BuildDate = \"[^\"]*\"|BuildDate = \"$BUILD_DATE\"|" cmd/apispec/main.go
          sed -i "s|GoVersion = \"[^\"]*\"|GoVersion = \"$GO_VERSION\"|" cmd/apispec/main.go

          # apispecui declares the same constants (BuildTime rather than
          # BuildDate — it reports the binary's mtime, which `make release`
          # cannot know). Patched here for the same reason as apispec: the
          # ldflags below cover a build, this covers a `go install` from the tag.
          sed -i "s|Version   = \"[^\"]*\"|Version   = \"$VERSION\"|" cmd/apispecui/main.go
          sed -i "s|Commit    = \"[^\"]*\"|Commit    = \"$COMMIT\"|" cmd/apispecui/main.go
          sed -i "s|GoVersion = \"[^\"]*\"|GoVersion = \"$GO_VERSION\"|" cmd/apispecui/main.go

      - name: Build for multiple platforms
        # The Makefile declares these with `?=`, so the environment wins and no
        # command line has to be built out of untrusted values at all.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          GO_VERSION: ${{ steps.version.outputs.go_version }}
        run: |
          # Build with updated version info
          make release
          
          # List built files
          echo "=== Contents of dist/ directory ==="
          ls -la dist/
          echo "=== Contents of root directory ==="
          ls -la
          echo "=== Looking for tar.gz files ==="
          ls -la *.tar.gz || echo "No tar.gz files found in root"
          echo "=== Current working directory ==="
          pwd

      - name: Update the Homebrew tap
        # Skipped automatically when the tap token is not configured, so the
        # release still succeeds on a fork or before the tap exists.
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # $1 = tool, $2 = platform. Checksums come from the artifacts THIS job
          # just built, so a formula can never point at a digest the release
          # does not have.
          sha() { shasum -a 256 "dist/$1-$2" | awk '{print $1}'; }

          git clone --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/ehabterra/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula

          # Every tool the tap publishes. apispecui is a distributable tool in
          # its own right, so it gets a formula on the same terms as apispec.
          for tool in apispec apispecui; do
            sed -e "s|__VERSION__|$VERSION|g" \
                -e "s|__SHA_DARWIN_ARM64__|$(sha "$tool" darwin-arm64)|" \
                -e "s|__SHA_DARWIN_AMD64__|$(sha "$tool" darwin-amd64)|" \
                -e "s|__SHA_LINUX_ARM64__|$(sha "$tool" linux-arm64)|" \
                -e "s|__SHA_LINUX_AMD64__|$(sha "$tool" linux-amd64)|" \
                "packaging/homebrew/$tool.rb.tmpl" > "/tmp/tap/Formula/$tool.rb"
          done

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/apispec.rb Formula/apispecui.rb
          git diff --staged --quiet || git commit -m "apispec $VERSION"
          git push

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apispec-${{ steps.version.outputs.version }}.tar.gz
            dist/apispec-linux-amd64
            dist/apispec-linux-arm64
            dist/apispec-darwin-amd64
            dist/apispec-darwin-arm64
            dist/apispec-windows-amd64.exe
            dist/apispec-windows-arm64.exe
            dist/apispecui-linux-amd64
            dist/apispecui-linux-arm64
            dist/apispecui-darwin-amd64
            dist/apispecui-darwin-arm64
            dist/apispecui-windows-amd64.exe
            dist/apispecui-windows-arm64.exe
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


